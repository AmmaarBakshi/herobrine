plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds Mojang, Fabric and Maven Central itself. Only Fabric API is a mod dependency.
}

loom {
	// Client code lives in src/client so it can never be loaded on a dedicated server.
	splitEnvironmentSourceSets()

	mods {
		"herobrine" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Explicit heap cap: without it the JVM sizes itself from total RAM and can fail to
		// commit memory on machines with a small page file.
		configureEach {
			vmArgs '-Xms512M', '-Xmx2G'
		}
		client {
			programArgs '--username', 'Dev'
		}
		// ./gradlew runClientGameTest -Pgametest=Sighting,Entity runs only matching tests.
		if (project.hasProperty('gametest')) {
			configureEach {
				if (name == 'clientGameTest') {
					vmArg "-Dherobrine.gametest=${project.property('gametest')}"
				}
			}
		}
		// Separate directory so a dedicated server and clients can run side by side.
		server {
			runDir 'run/server'
		}
	}
}

fabricApi {
	// In-game tests live in src/gametest (a separate test mod) and boot the real game:
	// ./gradlew runClientGameTest creates a world, drives the client and saves screenshots.
	configureTests {
		createSourceSet = true
		modId = 'herobrine-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['-Xlint:all,-processing,-serial,-classfile', '-Xmaxwarns', '500'])
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

def testRunDir = layout.buildDirectory.dir('test-run')

test {
	useJUnitPlatform()
	// Minecraft's log4j config writes logs/ into the working dir; keep that out of the repo root.
	workingDir = testRunDir.get().asFile
	doFirst { testRunDir.get().asFile.mkdirs() }
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

// Byte-for-byte reproducible jars: no file timestamps, stable entry order.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
