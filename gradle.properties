# Gradle performance
org.gradle.jvmargs=-Xmx2G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Fabric toolchain - check https://fabricmc.net/develop before bumping.
# Every version is pinned (no SNAPSHOT / "+") so builds are reproducible.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.2+26.3

# Mod
mod_version=0.1.0
maven_group=io.github.ammaarbakshi
archives_base_name=herobrine

# Test-only
junit_version=6.1.3
